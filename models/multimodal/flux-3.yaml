      operations:
        - curriculum-expansion
        - action-decoder-training
      scale_disclosed: false
      strategy: Add action prediction to the existing video curriculum and train a lightweight decoder over intermediate world-model features.
  strategy_summary:
    - Train all perceptual modalities in one backbone instead of separate image, video, and audio models.
    - Spend most compute on video prediction to learn dynamics, causality, contact, and motion.
    - Reuse the learned video representation for action prediction with limited task-specific data.
  unknowns:
