architecture:
  family: Multimodal flow model based on Self-Flow
  parameters: null
  notes: >-
    A unified backbone jointly models image, video, audio, and later action signals.
    The generally available video endpoint supports 720p and 1080p, clips up to
    twenty seconds, native audio, and keyframe conditioning. The August 17
    service update caps video-continuation requests at fifteen seconds, while
    text-to-video, image-to-video, and draft enhancement remain capped at twenty.
