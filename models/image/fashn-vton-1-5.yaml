    - name: FASHN synthetic same-person alternative-garment triplets
      catalog_id: null
      role: fine-tuning
      availability: not-released
      scale: 4 million synthetic triplets
      notes: Phase-one weights generate same-person alternative-garment supervision; source images and the exact number of examples consumed in phase two are not released.
  stages:
    - name: pretraining
      modalities:
