        - pixel-space-training
        - token-dropping
        - random-mask-conditioning
      scale_disclosed: true
      strategy: Train the pixel-space MMDiT from scratch on 18 million masked person-garment try-on pairs while dropping up to 75 percent of input tokens to reduce compute.
    - name: fine-tuning
      modalities:
        - image
      source_types:
        - proprietary
        - synthetic
      operations:
        - synthetic-triplet-generation
        - same-person-conditioning
        - garment-substitution
        - source-mixing
        - token-dropping
      scale_disclosed: true
      strategy: Continue training on a 50 to 50 mix of masked pairs and a four-million-item synthetic pool where the phase-one checkpoint creates the same person wearing an alternative garment.
  strategy_summary:
    - Train a 972M pixel-space MMDiT from scratch in two phases instead of inheriting an undisclosed foundation-model corpus.
    - Start from 18 million masked try-on pairs, then mix them equally with four million phase-one-generated same-person alternative-garment triplets.
    - Drop up to 75 percent of tokens during training to lower compute while retaining person identity, garment fidelity, and optional-mask control.
