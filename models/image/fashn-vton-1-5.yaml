architecture:
  family: 972M-parameter pixel-space MMDiT with double-stream, single-stream, and patch-mixer blocks
  parameters: 972000000
  notes: Generates 576 by 864 try-on images from person, garment, category, and optional mask inputs using 8 double-stream, 16 single-stream, and 4 patch-mixer blocks with 12 by 12 patches.
