id: lens
name: Lens
organization: Microsoft Research
released_at: "2026-05-20"
modalities:
  - image
tasks:
  - text-to-image
access:
  status: open-weights
  license: See the Microsoft Lens model card
  release_url: https://www.microsoft.com/en-us/research/publication/lens-rethinking-training-efficiency-for-foundational-text-to-image-models/
  weights_url: https://huggingface.co/microsoft/Lens
  api_url: null
architecture:
  family: Diffusion transformer with semantic VAE
  parameters: 3800000000
  notes: Compact T2I model optimized for information-dense batches and fast convergence.
data:
  disclosure_level: partial
  exact_datasets_disclosed: true
  exact_mixture_disclosed: false
  datasets:
    - name: Lens-800M
      catalog_id: lens-800m
      role: pretraining
      availability: not-released
      scale: 800M image-text pairs
      notes: Dense GPT-4.1 captions average approximately 109 words.
    - name: Lens-RL-8K
      catalog_id: lens-rl-8k
      role: preference
      availability: not-released
      scale: 8K prompts
      notes: Taxonomy-driven GPT-4.1 prompts paired with up to ten prompt-specific rubrics and one global structural-integrity rubric.
  stages:
    - name: pretraining
      modalities:
        - image
        - text
      source_types:
        - undisclosed
        - synthetic
      operations:
        - dense-recaptioning
        - multi-resolution-batching
        - aspect-ratio-diversification
      scale_disclosed: true
      strategy: Maximize information density with long GPT-4.1 captions and mixed-resolution, diverse-aspect-ratio batches.
    - name: preference
      modalities:
        - image
        - text
      source_types:
        - synthetic
      operations:
        - taxonomy-driven-prompting
        - rubric-based-rewarding
      scale_disclosed: true
      strategy: Apply reinforcement learning on Lens-RL-8K using structured reward rubrics to reduce artifacts and improve visual quality.
    - name: distillation
      modalities:
        - image
        - text
      source_types:
        - synthetic
      operations:
        - step-distillation
      scale_disclosed: false
      strategy: Distill the foundation model into a four-step turbo variant for faster inference.
  strategy_summary:
    - Increase semantic supervision per sample through unusually long synthetic captions.
    - Increase visual diversity per optimization step through mixed resolution and aspect ratio.
    - Use a small taxonomy-driven RL set instead of broad undirected post-training data.
  unknowns:
    - Original media sources, rights, and filtering pipeline for Lens-800M.
    - Exact pretraining mixture, deduplication policy, and safety filters.
    - Dataset files and dataset-specific terms for Lens-RL-8K have not been released.
evidence:
  release: https://www.microsoft.com/en-us/research/publication/lens-rethinking-training-efficiency-for-foundational-text-to-image-models/
