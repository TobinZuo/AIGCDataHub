  strategy_summary:
    - Filter low-quality imagery, apply semantic and low-level visual deduplication, refine captions, and strengthen cross-modal retrieval before multi-resolution training.
    - Mix natural knowledge figures with synthetic OCR and LaTeX formula imagery, then jointly optimize generation and instruction-based editing.
    - Accelerate serving with adversarial distillation, distribution matching, 4-bit or 8-bit quantization, and speculative decoding.
