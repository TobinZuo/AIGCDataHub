  strategy_summary:
    - Publish production targets for identity fidelity, garment fidelity, multi-item layering, latency, and cost without disclosing the training corpus behind them.
    - Support packshot or on-model garment references, up to four garments, and person-preserving transfer through a public API endpoint.
    - Keep inference-time image preparation and moderation guidance separate from training-data claims because the official sources do not connect them.
    - Supersede v1 with an API-compatible v2 endpoint that raises the as-is input and output ceiling from 2 to 4 megapixels while retaining the same request and response shape.
