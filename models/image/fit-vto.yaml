id: fit-vto
name: Fit-VTO
organization: University of Washington and Google Research
released_at: "2026-04-09"
modalities:
  - image
tasks:
  - virtual-try-on
  - fit-aware-generation
  - garment-conditioned-generation
  - identity-preserving-editing
access:
  status: research-preview
  license: Model-specific checkpoint terms are not published
  release_url: https://johannakarras.github.io/FIT/
  weights_url: null
  api_url: null
architecture:
  family: Measurement-conditioned FLUX.1-dev MMDiT LoRA
  parameters: null
  notes: Encodes person and lay-flat garment images separately, replaces text embeddings with body and garment measurements, and combines the conditions with noisy target latents.
data:
  disclosure_level: partial
  exact_datasets_disclosed: true
  exact_mixture_disclosed: false
  datasets:
    - name: FLUX.1-dev inherited pretraining mixture
      catalog_id: null
      role: pretraining
      availability: undisclosed
      scale: null
      notes: Fit-VTO inherits the FLUX.1-dev visual prior, whose exact source corpus and mixture are not restated by this release.
    - name: Full FIT training collection
      catalog_id: null
      role: fine-tuning
      availability: not-released
      scale: 1,064,824 training triplets
      notes: The project describes the full synthetic training collection, but only the smaller preview is currently downloadable.
    - name: FIT-VTO-100K
      catalog_id: fit-vto-100k
      role: fine-tuning
      availability: public
      scale: 100,000 training and 5,000 evaluation triplets
      notes: This public preview exposes the same person, garment, target, and measurement structure for partial reproduction and evaluation.
  stages:
    - name: pretraining
      modalities:
        - image
        - text
      source_types:
        - undisclosed
      operations:
        - inherited-foundation-model
      scale_disclosed: false
      strategy: Reuse the pretrained FLUX.1-dev MMDiT and VAE visual prior; this release does not restate the foundation model's source corpus.
    - name: fine-tuning
      modalities:
        - image
      source_types:
        - synthetic
        - public-dataset
      operations:
        - lora-fine-tuning
        - paired-person-conditioning
        - garment-conditioning
        - measurement-conditioning
        - vae-latent-encoding
        - channel-concatenation
        - sequence-concatenation
        - identity-preserving-training
      scale_disclosed: true
      strategy: Fine-tune FLUX.1-dev with LoRA on FIT triplets, using separate person and garment latents plus explicit body and garment measurement embeddings to preserve identity while controlling fit.
  strategy_summary:
    - Turn procedurally simulated, physics-draped garments into more than one million photorealistic supervised try-on triplets with exact body and garment measurements.
    - Preserve identity by pairing the same generated person across different garments, then condition the model on person, garment, and measurement signals separately.
    - Release a 105K preview and generation pipeline while leaving the full training collection and Fit-VTO checkpoint unavailable.
  unknowns:
    - Exact FLUX.1-dev source corpus, rights composition, and inherited mixture weights.
    - Whether every reported Fit-VTO result uses the complete 1,064,824-row training split and the exact rejection rate after data quality filtering.
    - Fit-VTO checkpoint availability, model-specific license, training hyperparameters, and total compute.
evidence:
  release: https://johannakarras.github.io/FIT/
