  stages:
    - name: pretraining
      modalities:
        - image
        - video
        - audio
        - text
      source_types:
        - public-dataset
        - licensed
        - synthetic
      operations:
        - strict-deduplication
        - quality-filtering
        - watermark-filtering
        - embedding-cluster-balancing
        - multimodal-captioning
        - shot-boundary-detection
        - audio-video-alignment
      scale_disclosed: false
      strategy: Mix named public datasets with authorized film and web video, deduplicate and filter each modality, balance image clusters, segment videos into shots, and create structured visual and acoustic captions.
    - name: fine-tuning
      modalities:
        - image
        - video
        - audio
        - text
      source_types:
        - licensed
        - synthetic
        - proprietary
      operations:
        - multilingual-text-synthesis
        - multilingual-tts
        - editing-pair-synthesis
        - inpainting-pair-synthesis
        - joint-audio-video-training
      scale_disclosed: false
      strategy: Add synthetic multilingual typography, speech, visual editing, and inpainting supervision, then jointly fine-tune the audio and video streams for instruction following and synchronized output.
  strategy_summary:
    - Combine public image, video, and audio datasets with licensed film, television, short-video, and web-series content.
    - Build missing supervision synthetically for multilingual text, multilingual speech, inpainting, and editing.
    - Apply modality-specific deduplication, quality and watermark filters, balancing, shot segmentation, and structured multimodal captioning.
  unknowns:
    - Complete dataset inventory behind each “etc.”, exact snapshots, licenses applied by Skywork, sample counts, and mixture ratios.
    - Exact SFT mixture, rater or preference data, and whether the API checkpoint differs from the report.
