architecture:
  family: Dual-stream Multimodal Diffusion Transformer for joint video-audio generation
  parameters: null
  notes: Symmetric video and audio MMDiT branches use bidirectional cross-attention, a shared frozen MLLM encoder, channel-concatenation inpainting, and low-resolution plus high-resolution keyframe refinement.
