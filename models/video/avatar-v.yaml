        - demographic-balancing
        - attribute-annotation
        - bad-case-filtering
        - personality-supervised-fine-tuning
      scale_disclosed: true
      strategy: Build 10M+ avatar-specific clips with ten quality signals, human annotations, and same-identity cross-scene pairs for audio-to-video adaptation and personality SFT.
    - name: distillation
      modalities:
        - video
        - audio
      source_types:
        - synthetic
      operations:
        - cfg-distillation
        - distribution-matching-distillation
      scale_disclosed: false
      strategy: Distill classifier-free guidance and then apply three-model distribution matching distillation to reduce inference cost.
    - name: preference
      modalities:
        - video
        - audio
      source_types:
        - human-feedback
      operations:
        - quality-scoring
        - pairwise-preference-labeling
        - direct-preference-optimization
        - group-relative-policy-optimization
        - kl-regularization
      scale_disclosed: false
      strategy: Align identity fidelity, motion naturalness, lip synchronization, and visual quality with human preference pairs using DPO and GRPO.
  strategy_summary:
    - Separate a broad 100M+ video pretraining pool from a 10M+ densely annotated avatar specialization corpus.
    - Link the same person across visually different clips so the model learns identity separately from scene, pose, and lighting.
    - Combine automated quality signals with calibrated human labels for filtering, reward modeling, and preference alignment.
    - Run the data engine continuously so sources and annotations can be reprocessed as curation models improve.
  unknowns:
