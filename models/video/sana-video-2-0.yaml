id: sana-video-2-0
name: SANA-Video 2.0
organization: NVIDIA
released_at: "2026-07-23"
modalities:
  - video
tasks:
  - text-to-video
  - image-to-video
access:
  status: research-preview
  license: Code is Apache-2.0; SANA-Video 2.0 weights have not been released
  release_url: https://nvlabs.github.io/Sana/Video2/
  weights_url: null
  api_url: null
architecture:
  family: Hybrid linear-attention and softmax-attention video diffusion transformer
  parameters: 14000000000
  notes: The report describes 5B and 14B variants trained progressively up to 720p, with a joint image-video recipe.
data:
  disclosure_level: partial
  exact_datasets_disclosed: false
  exact_mixture_disclosed: false
  datasets:
    - name: Curated in-house image and video training pool
      catalog_id: sana-video-2-progressive-training-pools
      role: pretraining
      availability: not-released
      scale: approximately 30M pretraining clips, 10M continual-training clips, and 10K supervised-fine-tuning clips
      notes: The report names no source datasets and does not establish whether the three stage pools overlap, but it discloses their approximate clip counts and progressive 480p-to-720p schedule.
    - name: Gemini-ranked generated video preference pairs
      catalog_id: sana-video-2-preference-pairs
      role: preference
      availability: not-released
      scale: null
      notes: Generated candidates are ranked for visual fidelity, prompt alignment, motion quality, and temporal coherence before unreliable comparisons are removed.
  stages:
    - name: pretraining
      modalities:
        - image
        - video
        - text
      source_types:
        - proprietary
      operations:
        - shot-segmentation
        - subtitle-removal
        - quality-filtering
        - motion-filtering
        - text-media-filtering
        - structured-recaptioning
        - image-video-joint-training
        - progressive-resolution-training
      scale_disclosed: true
      strategy: Build an approximately 30M-clip broad pool through shot segmentation and independent visual, motion, exposure, artifact, alignment, and shot-integrity filters, then pretrain at 480p on five-second 16/24 FPS clips.
    - name: midtraining
      modalities:
        - image
        - video
        - text
      source_types:
        - proprietary
      operations:
        - stricter-quality-filtering
        - dense-recaptioning
        - motion-description
        - image-video-joint-training
      scale_disclosed: true
      strategy: Continue training on an approximately 10M-clip stricter-quality pool while moving from 480p to 720p and five to eight seconds, adding denser structured captions and motion descriptions, and retaining interleaved image batches.
    - name: fine-tuning
      modalities:
        - video
        - text
      source_types:
        - proprietary
      operations:
        - trusted-subset-selection
        - supervised-fine-tuning
      scale_disclosed: true
      strategy: Supervise the model on an approximately 10K-clip trusted 720p, 24 FPS, eight-second subset selected from the progressively curated video pool, without publishing the clips or selection thresholds.
    - name: preference
      modalities:
        - video
        - text
      source_types:
        - synthetic
      operations:
        - pairwise-ranking
        - unreliable-pair-filtering
        - diffusion-dpo
        - online-reward-learning
        - reward-ensembling
      scale_disclosed: false
      strategy: Apply Diffusion-DPO to Gemini-ranked generated pairs, then online reward fine-tuning with HPSv3++, DeQA-Score, and UniPercept while regularizing against the frozen base model.
  strategy_summary:
    - Turn heterogeneous in-house clips into progressively stricter pretraining, continual-training, and trusted fine-tuning pools through independent quality axes.
    - Increase resolution, frame rate, duration, and caption density in stages while interleaving images to preserve spatial quality.
    - Combine filtered pairwise preferences with an online visual-quality reward ensemble after supervised training.
  unknowns:
    - Source dataset identities, image-batch scale, stage-pool overlap, mixture ratios, collection dates, and media-rights composition.
    - Exact thresholds and retention rates for every filtering dimension and trusted-subset selection.
    - The complete preference-pair count, prompt distribution, Gemini configuration, and reward-optimization sample budget.
    - Release timing and license terms for SANA-Video 2.0 weights and training data.
evidence:
  release: https://nvlabs.github.io/Sana/Video2/
  technical_report: https://arxiv.org/abs/2607.21553
  repository: https://github.com/NVlabs/Sana
status: watch
