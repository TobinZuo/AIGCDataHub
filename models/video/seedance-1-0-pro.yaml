        - dimension-specific-reward-modeling
        - video-rlhf
        - feedback-driven-learning
      scale_disclosed: false
      strategy: Apply video-specific RLHF with dimension-specific reward models to improve motion vividness, structural stability, and visual quality.
    - name: distillation
      modalities:
        - video
        - text
      source_types:
        - synthetic
        - human-feedback
      operations:
        - trajectory-segmented-consistency-distillation
        - score-distillation
        - adversarial-multistep-distillation
      scale_disclosed: false
      strategy: Combine consistency, score, and adversarial multi-step distillation with preference supervision to reduce sampling steps while retaining quality.
  strategy_summary:
    - Build a broad video prior through shot segmentation, adaptive cropping, rule and detector filtering, balancing, and precise dense captioning.
    - Unify text-to-video, image-to-video, and multi-shot learning through conditional masks and interleaved multimodal position encoding.
    - Use specialized SFT subsets, model merging, video RLHF, and multi-stage distillation for quality, controllability, and speed.
