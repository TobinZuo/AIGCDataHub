      scale: 62,856 fMRI-video pairs from three subjects and 2,174 unique stimuli
      notes: The paper discloses subject counts, acquisition, preprocessing, repeat trials, sliding-window construction, and train/test splits, but no public data-access path.
  stages:
    - name: fine-tuning
