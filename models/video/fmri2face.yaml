        - fmri-acquisition
        - fmri-preprocessing
        - temporal-windowing
        - appearance-context-prediction
        - morphable-face-parameter-prediction
        - geometry-controlled-video-diffusion
      scale_disclosed: true
      strategy: Fit subject-conditioned appearance and 3D facial-motion predictors on 1,994 training stimuli, then synthesize temporally coherent face videos with geometry-guided diffusion and evaluate on 180 held-out stimuli.
  strategy_summary:
    - Use controlled, background-free full-HD digital-human stimuli to isolate identity, expression, and head-pose responses.
    - Separate brain-derived global appearance from explicit morphable 3D motion control before video diffusion.
    - Preserve participant-aware splits and temporal alignment across fMRI volumes and overlapping video windows.
  unknowns:
    - Code, base video checkpoint, training hyperparameters, parameter counts, checkpoint license, and release plan.
    - Public data-use agreement, participant-level consent scope for redistribution, de-identification controls, and access-review process.
    - Demographic diversity beyond the reported three participants aged 22 to 24.
