license:
  metadata: Not disclosed
  media: Digital-human assets and sensitive fMRI responses; reuse terms are not published
  commercial_use: unknown
  redistribution: unknown
  notes: Ethics approval and written informed consent are reported, but no public data license, participant-level consent scope, or redistribution protocol is available.
quality:
  dimensions:
    - visual-quality
    - temporal-consistency
    - geometry-quality
    - human-preference
    - provenance
  known_limitations:
    - Only three participants aged 22 to 24 were scanned, limiting demographic and cross-subject generalization.
    - Controlled background-free digital-human stimuli differ from natural facial behavior and social context.
    - Brain data is sensitive personal data and should not be redistributed or re-identified without an explicit approved governance process.
processing:
