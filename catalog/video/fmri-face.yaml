scale:
  samples: 62856
  source_items: 2174
  hours: null
  approximate: false
  notes: Three subjects viewed 2,174 unique 8-second, 240-frame, 30 FPS, 1920x1080 digital-human clips. Sliding 1.6-second fMRI windows yield 18,108 training and 2,844 test pairs per subject, totaling 62,856.
annotations:
  types:
    - fmri-response
