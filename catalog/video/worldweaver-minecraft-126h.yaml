license:
  metadata: Not published
  media: Not published; Minecraft and generated-annotation dependencies require review
  commercial_use: unknown
  redistribution: unknown
  notes: CC-BY-4.0 applies to the paper, not automatically to unreleased data; no dataset license or Minecraft asset-rights grant is stated.
quality:
  dimensions:
    - visual-quality
    - motion
    - temporal-consistency
    - text-media-alignment
    - geometry-quality
    - multi-view-consistency
    - provenance
  known_limitations:
    - Files and collection code are unavailable, so episode distribution, duplicates, corruption, and reported duration cannot be independently audited.
    - The corpus covers two-agent Minecraft sessions and may not transfer to real-world agents, photorealistic scenes, more players, or different action spaces.
    - Scene text is generated offline by Qwen2.5-VL-72B-Instruct and can inherit hallucinations or miss state changes despite conditioning on synchronized views and actions.
    - The paper does not publish safety filtering, participant or server diversity, or dataset-specific usage terms.
processing:
  recipe: null
  recommended_format: native
  notes: Preserve all three synchronized camera streams, 20-Hz state and controller logs, and the four-frame scene-text alignment if files are released; do not infer missing counts from duration alone.
