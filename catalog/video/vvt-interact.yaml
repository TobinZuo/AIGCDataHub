id: vvt-interact
name: VVT-Interact
organization: Sun Yat-sen University and Alibaba Group
released_at: "2026-05-20"
release_date_source: https://arxiv.org/abs/2605.21431
modality: video
tasks:
  - video-virtual-try-on
