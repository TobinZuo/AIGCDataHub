id: vividhead
name: VividHead
organization: Soul AI Lab
released_at: "2026-02-06"
release_date_source: https://huggingface.co/api/datasets/Soul-AILab/VividHead
modality: video
tasks:
  - talking-head-generation
  - audio-driven-animation
  - lip-sync
stages:
