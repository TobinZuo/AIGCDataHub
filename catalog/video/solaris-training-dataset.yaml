id: solaris-training-dataset
name: Solaris Training Dataset
organization: New York University VISIONx
released_at: "2026-02-21"
release_date_source: https://huggingface.co/datasets/nyu-visionx/solaris-training-dataset
modality: video
tasks:
  - image-to-video
  - action-conditioned-video-generation
  - multi-agent-world-modeling
  - streaming-video-generation
stages:
  - fine-tuning
  - data-curation
description: >-
  A public synchronized two-player Minecraft world-model corpus collected with
  SolarisEngine, pairing 720p video at 20 FPS with semantic movement, camera,
  interaction, mining, placement, mount, and hotbar actions.
access:
  status: open
  type: hosted
  url: https://huggingface.co/datasets/nyu-visionx/solaris-training-dataset
  requires_account: false
  notes: Download the 332 GB sharded release with the Hugging Face CLI, then use the official Solaris unshard_dataset.py script to reconstruct the Duet directory.
scale:
  samples: 12640000
  source_items: 9240
  hours: null
  approximate: false
  notes: The paper reports 12.64M combined frames, 6.32M per player, over 9,240 synchronized episodes at 20 FPS; combined frame count must not be interpreted as unique wall-clock duration.
annotations:
  types:
    - two-player-video
    - semantic-action
    - camera-yaw-pitch
    - episode-category
    - episode-type
    - world-type
  source: model-generated
  languages:
    - none
license:
  metadata: Apache-2.0
  media: Apache-2.0 dataset card plus Minecraft-dependent game imagery
  commercial_use: review-required
  redistribution: review-required
  notes: The official card declares Apache-2.0, but users should separately review Minecraft/Mojang game-content terms and any rights not conveyed by a repository license.
quality:
  dimensions:
    - visual-quality
    - motion
    - temporal-consistency
    - multi-view-consistency
    - provenance
  known_limitations:
    - The corpus is generated by pre-programmed bots in Minecraft and does not reproduce the full diversity, intent, or error patterns of human multiplayer behavior.
    - Semantic actions exclude raw mouse events and inventory GUI opening or closing, limiting crafting and inventory-interaction coverage.
    - Episode types are sampled with length-dependent weights, so raw clip counts are not a uniform task distribution.
    - Underwater episodes are filtered with a learned HUD detector; selection errors and the removed examples are not distributed as a separate audit set.
processing:
  recipe: null
  recommended_format: native
  notes: Keep both players synchronized at the episode level, retain semantic actions and world metadata, and use the official unsharding script rather than treating shard files as independent examples.
evidence:
  homepage: https://huggingface.co/datasets/nyu-visionx/solaris-training-dataset
  paper: https://arxiv.org/abs/2602.22208
  used_by:
    - Solaris
status: verified
last_verified: "2026-07-27"
