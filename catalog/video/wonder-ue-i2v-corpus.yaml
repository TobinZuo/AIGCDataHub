id: wonder-ue-i2v-corpus
name: Wonder UE I2V Corpus
organization: Adobe Research and Johns Hopkins University
released_at: "2026-07-28"
release_date_source: https://arxiv.org/abs/2607.26037
modality: video
tasks:
  - image-to-video
  - camera-controlled-video-generation
  - long-video-generation
stages:
  - fine-tuning
  - data-curation
description: >-
  An unreleased large-scale Unreal Engine image-to-video training corpus rendered
  across indoor and outdoor environments with difficult, user-like camera paths.
access:
  status: unavailable
  type: none
  url: https://arxiv.org/html/2607.26037
  requires_account: false
  notes: The Wonder paper describes this corpus but provides no download, browser, request form, repository, or announced release date.
scale:
  samples: null
  source_items: null
  hours: null
  approximate: true
  notes: The paper says large-scale but discloses no clip, frame, scene, or hour count.
annotations:
  types:
    - hierarchical-caption
    - camera-intrinsics
    - camera-extrinsics
    - discrete-camera-action
    - clip-duration
  source: model-generated
  languages:
    - en
license:
  metadata: Not stated
  media: Not stated
  commercial_use: unknown
  redistribution: unknown
  notes: No dataset license, asset provenance, redistribution grant, or commercial-use terms are published because the corpus is not released.
quality:
  dimensions:
    - visual-quality
    - text-media-alignment
    - motion
    - temporal-consistency
    - geometry-quality
    - provenance
  known_limitations:
    - Exact scale, asset sources, rights, mixture weights, and release plans are undisclosed.
    - Synthetic UE environments may not reproduce the full distribution of real scenes and camera behavior.
    - VLM captions, estimated poses, and VLM quality filtering can introduce model-specific errors and selection bias.
processing:
  recipe: Render indoor and outdoor UE environments along sharp turns, lateral and backward movements, and compound camera trajectories; clip to 5, 10, and 20 seconds, filter invalid media and motion, caption hierarchically, estimate and smooth poses, augment time, and apply a final VLM quality check.
  recommended_format: native
  notes: If released, preserve render assets and licenses, raw and smoothed poses, discrete actions, global and subclip captions, temporal augmentations, rejection reasons, and versioned mixture membership.
evidence:
  homepage: https://wonder-world-model.github.io/
  paper: https://arxiv.org/abs/2607.26037
  used_by:
    - Wonder
status: partial
