id: openhumanvid-talking
name: OpenHumanVid-Talking
organization: Haoson Zhang
released_at: "2026-07-15"
release_date_source: https://huggingface.co/datasets/Haosonnn/OpenHumanVid-Talking
modality: video
tasks:
  - audio-driven-avatar
  - talking-head-generation
  - text-to-video
stages:
  - fine-tuning
  - data-curation
description: >-
  A speech-active talking-head subset derived from OpenHumanVid, with camera
  trajectories, active-speaker intervals, face and lip boxes, motion scores,
  captions, and clips packaged for audio-conditioned avatar training.
derived_from:
  - catalog_id: openhumanvid
    relationship: filtered-subset
    contribution: Source talking-head videos from parts 001 through 040
    notes: The derivative selects motion-rich, speech-active, single-speaker intervals from OpenHumanVid and adds camera, face, lip, motion, and caption annotations.
access:
  status: open
  type: hosted
  url: https://huggingface.co/datasets/Haosonnn/OpenHumanVid-Talking
  requires_account: false
  notes: The public repository contains 17 Parquet shards, approximately 34 GB of embedded video data, and a companion NPZ annotation file.
scale:
  samples: 32176
  source_items: null
  hours: 86
  approximate: true
  notes: The official card reports 32,176 clips and approximately 86 hours curated from OpenHumanVid parts 001 through 040.
annotations:
  types:
    - embedded-video
    - camera-intrinsics
    - camera-extrinsics
    - keyframe-index
    - active-speaker-interval
    - face-box
    - lip-box
    - face-confidence
    - motion-score
    - video-caption
    - source-label
  source: mixed
  languages:
    - multilingual
license:
  metadata: CC-BY-NC-4.0
  media: CC-BY-NC-4.0 release terms layered on OpenHumanVid and original-source rights
  commercial_use: noncommercial
  redistribution: review-required
  notes: The derivative release is non-commercial; users must also satisfy OpenHumanVid and original-source conditions before redistributing or training on embedded media.
quality:
  dimensions:
    - visual-quality
    - audio-quality
    - audio-visual-alignment
    - motion
    - temporal-consistency
    - geometry-quality
    - provenance
  known_limitations:
    - The set is derived only from OpenHumanVid parts 001 through 040 and may not represent the full source distribution.
    - Automated VAD, face, active-speaker, SLAM, camera-motion, and caption models can introduce false positives, exclusions, and geometric errors.
    - The public card does not provide detailed speaker, language, demographic, consent, or per-source rights distributions.
    - Non-commercial and layered upstream terms require review before media redistribution or production use.
processing:
  recipe: Select the highest-motion OpenHumanVid clips, require speech with Silero VAD, prefilter faces, retain TalkNet active-speaker islands of at least three seconds, estimate cameras with MonST3R, filter camera motion, and attach MediaPipe face and lip boxes plus Gemini captions.
  recommended_format: parquet
  notes: Join Parquet videos and row metadata with the companion NPZ file when using the released DiffSynth-InContext-Control training path; preserve upstream part and source labels.
evidence:
  homepage: https://huggingface.co/datasets/Haosonnn/OpenHumanVid-Talking
  paper: null
  used_by: []
