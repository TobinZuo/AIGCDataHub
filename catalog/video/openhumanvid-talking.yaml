id: openhumanvid-talking
name: OpenHumanVid-Talking
organization: Haoson Zhang
released_at: "2026-07-15"
release_date_source: https://huggingface.co/datasets/Haosonnn/OpenHumanVid-Talking
modality: video
tasks:
  - audio-driven-avatar
  - talking-head-generation
  - text-to-video
stages:
  - fine-tuning
  - data-curation
description: >-
  A speech-active talking-head subset derived from OpenHumanVid, with camera
  trajectories, active-speaker intervals, face and lip boxes, motion scores,
  captions, and clips packaged for audio-conditioned avatar training.
derived_from:
  - catalog_id: openhumanvid
    relationship: filtered-subset
    contribution: Source talking-head videos from parts 001 through 030
    notes: The replacement release selects speech-active intervals from OpenHumanVid and adds metric camera, face, lip, motion, caption, and per-frame active-speaker annotations.
access:
  status: open
  type: hosted
  url: https://huggingface.co/datasets/Haosonnn/OpenHumanVid-Talking
  requires_account: false
  notes: The replacement public repository contains six Parquet shards, approximately 10.5 GB of embedded video data, and a companion NPZ annotation file.
scale:
  samples: 8989
  source_items: null
  hours: 12
  approximate: true
  notes: The current official card reports 8,989 clips and approximately 12 hours curated from OpenHumanVid parts 001 through 030; the earlier 32,176-clip release was removed and replaced.
annotations:
  types:
    - embedded-video
    - camera-intrinsics
    - camera-extrinsics
    - keyframe-index
    - active-speaker-interval
    - face-box
    - lip-box
    - face-confidence
    - active-speaker-confidence
    - active-speaker-track-id
    - visible-track-count
    - speaker-switch-count
    - motion-score
    - video-caption
    - source-label
  source: mixed
  languages:
    - multilingual
license:
  metadata: CC-BY-NC-4.0
  media: CC-BY-NC-4.0 release terms layered on OpenHumanVid and original-source rights
  commercial_use: noncommercial
  redistribution: review-required
  notes: The derivative release is non-commercial; users must also satisfy OpenHumanVid and original-source conditions before redistributing or training on embedded media.
quality:
  dimensions:
    - visual-quality
    - audio-quality
    - audio-visual-alignment
    - motion
    - temporal-consistency
    - geometry-quality
    - provenance
  known_limitations:
    - The replacement set is derived only from OpenHumanVid parts 001 through 030 and may not represent the full source distribution.
    - 807 of 8,989 clips contain at least one active-speaker identity switch, so consumers must use the per-frame track IDs rather than assuming one identity per clip.
    - Automated VAD, face tracking, active-speaker selection, MegaSaM camera recovery, camera-motion filtering, and captioning can introduce false positives, exclusions, and geometric errors.
    - The public card does not provide detailed speaker, language, demographic, consent, or per-source rights distributions.
    - Non-commercial and layered upstream terms require review before media redistribution or production use.
processing:
  recipe: Select speech-active OpenHumanVid clips, run face tracking and per-frame active-speaker selection, retain usable speech islands, recover metric camera trajectories with MegaSaM, filter camera motion, and attach face and lip boxes plus captions.
  recommended_format: parquet
  notes: Join Parquet videos and row metadata with the companion NPZ file; preserve upstream part and source labels, per-frame speaker identities, and the documented world-to-camera storage convention despite the historical c2w field name.
evidence:
  homepage: https://huggingface.co/datasets/Haosonnn/OpenHumanVid-Talking
  paper: null
  used_by: []
status: verified
last_verified: "2026-08-16"
