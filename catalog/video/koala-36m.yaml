id: koala-36m
name: Koala-36M
organization: Kling AI Research
released_at: "2024-10-10"
release_date_source: https://arxiv.org/abs/2410.08260
modality: video
tasks:
  - text-to-video
  - video-text-pretraining
stages:
  - pretraining
  - data-curation
description: >-
  A large video-text corpus built with transition-aware temporal splitting,
  long structured captions, and a learned video-training-suitability score for
  text-to-video pretraining and condition-aware data selection.
access:
  status: metadata-only
  type: urls
  url: https://huggingface.co/datasets/Koala-36M/Koala-36M-v1
  requires_account: false
  notes: The hosted release contains clip URLs, timestamps, captions, and quality scores rather than redistributable source video files.
scale:
  samples: 35961606
  source_items: null
  hours: null
  approximate: true
  notes: Hugging Face estimates 35,961,606 rows; the paper and project round the collection to 36M clips.
annotations:
  types:
    - structured-caption
    - clip-timestamp
    - clarity-score
    - aesthetic-score
    - motion-score
    - video-training-suitability-score
  source: model-generated
  languages:
    - en
license:
  metadata: Unknown
  media: Source-dependent YouTube terms and uploader rights
  commercial_use: unknown
  redistribution: review-required
  notes: The official dataset card does not state a dataset-specific license; URL metadata does not grant rights to download, train on, or redistribute source videos.
quality:
  dimensions:
    - visual-quality
    - text-media-alignment
    - aesthetics
    - motion
    - temporal-consistency
    - provenance
  known_limitations:
    - The release is a URL and metadata index, so availability can change when source videos are removed or restricted.
    - Very long model-generated captions can contain hallucinations or emphasize details that are weakly visible in the clip.
    - The learned suitability score encodes annotator and model preferences and can narrow cultural, stylistic, and motion diversity.
processing:
  recipe: recipes/video_text
  recommended_format: parquet
  notes: Preserve the source URL and timestamps, revalidate media rights, and pin the metadata revision before resolving any video.
evidence:
  homepage: https://github.com/KlingAIResearch/Koala-36M
  paper: https://arxiv.org/abs/2410.08260
  used_by: []
status: partial
last_verified: "2026-07-26"
