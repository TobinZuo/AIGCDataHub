id: viton-hd-edit
name: VITON-HD-edit
organization: NXN Labs and KAIST
released_at: "2026-07-10"
release_date_source: https://github.com/nxnai/CtrlVTON
modality: image
tasks:
  - virtual-try-on
  - controllable-virtual-try-on
  - garment-instance-segmentation
  - image-editing
  - virtual-try-on-evaluation
stages:
  - evaluation
  - data-curation
description: >-
  A public derivative of the 2,032-case VITON-HD test split that adds a
  synthesized same-person reference image and two garment-instance masks for
  image-editing try-on, segmentation, and spatial-control evaluation.
access:
  status: open
  type: hosted
  url: https://huggingface.co/datasets/NXN-Labs/VITON-HD-edit
  requires_account: false
  notes: The Hugging Face repository is directly downloadable and reports 6,096 image rows totaling about 377 MB.
scale:
  samples: 2032
  source_items: 6096
  hours: null
  approximate: false
  notes: Each VITON-HD test case gains three derived fields; the Hub viewer materializes those fields as 6,096 labeled image rows rather than 6,096 independent try-on cases.
annotations:
  types:
    - target-person-image
    - reference-garment-image
    - synthesized-reference-person
    - edited-garment-mask
    - target-garment-mask
    - inherited-viton-hd-fields
  source: mixed
  languages:
    - en
license:
  metadata: CC-BY-NC-SA-4.0
  media: CC-BY-NC-SA-4.0 release layered on VITON-HD CC-BY-NC-4.0 source material
  commercial_use: noncommercial
  redistribution: allowed
  notes: Attribution and ShareAlike apply to the derived release; the upstream VITON-HD material is also restricted to non-commercial use and remains independently binding.
quality:
  dimensions:
    - visual-quality
    - geometry-quality
    - provenance
  known_limitations:
    - This is an evaluation derivative of the VITON-HD test split, not the private dataset used to train CtrlVTON.
    - It inherits VITON-HD's frontal-view women and upper-body clothing distribution, limiting demographic, pose, viewpoint, and garment-category coverage.
    - Reference-person images are synthesized and garment masks are generated by VIP-SAM, so generation and segmentation errors can affect all three supported evaluations.
    - The Hub viewer stores the three contributed image fields as separate rows, so row count must not be interpreted as independent benchmark cases.
processing:
  recipe: Apply the CtrlVTON data pipeline to all 2,032 VITON-HD test pairs, synthesize the same person wearing a different garment, then use VIP-SAM to extract the swapped-garment mask and the reference garment's target-person mask.
  recommended_format: native
  notes: Preserve the original VITON-HD directory fields and join the three derived image fields by source case rather than treating viewer rows as independent samples.
evidence:
  homepage: https://huggingface.co/datasets/NXN-Labs/VITON-HD-edit
  paper: https://arxiv.org/abs/2607.09362
  used_by:
    - CtrlVTON
status: verified
last_verified: "2026-07-26"
