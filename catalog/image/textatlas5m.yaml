annotations:
  types:
    - generation-prompt
    - rendered-text
    - image-path
    - subset-name
    - layout-and-style-attributes
  source: mixed
  languages:
    - multilingual
license:
  metadata: No single license declared in the current dataset card
  media: Mixed synthetic and source-derived media
  commercial_use: review-required
  redistribution: review-required
  notes: Review subset construction, font licenses, document and scene sources, and the current repository terms before commercial or redistributed use.
quality:
  dimensions:
    - visual-quality
    - text-media-alignment
    - aesthetics
    - provenance
  known_limitations:
