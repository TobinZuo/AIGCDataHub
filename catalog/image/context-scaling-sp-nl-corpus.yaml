quality:
  dimensions:
    - visual-quality
    - text-media-alignment
    - geometry-quality
    - provenance
    - deduplication
    - safety
  known_limitations:
    - Image sources, collection rights, licenses, scale, language distribution, and safety policy are undisclosed.
    - Specialist models and final VLM reconciliation can propagate pose, depth, segmentation, OCR, and semantic errors.
    - The paper does not publish image-level deduplication or train-evaluation overlap controls.
processing:
  recipe: Use Seed-VL for dense semantics, Sapiens for 133-keypoint pose, Depth Anything V2 for depth, SAM 2.1 for masks, and a final VLM reconciliation pass; serialize six nested prompt levels and randomly expose structured or natural-language conditioning.
  recommended_format: native
  notes: If released, preserve source rights, specialist-model versions, every nested level, masked fields, reconciliation output, rejection reasons, and split membership.
