annotations:
  types:
    - generation-prompt
    - ocr-text
    - text-region
    - poster-caption
    - style-metadata
  source: mixed
  languages:
    - multilingual
license:
  metadata: Component-specific Hugging Face licenses
  media: Poster100K is CC-BY-NC-SA-4.0; verify Text-Render-2M terms separately
  commercial_use: noncommercial
  redistribution: review-required
  notes: This aggregate card uses the more restrictive known component boundary; review both repository cards and all source and font rights before use.
quality:
  dimensions:
    - visual-quality
    - text-media-alignment
    - aesthetics
    - provenance
  known_limitations:
