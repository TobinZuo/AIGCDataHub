quality:
  dimensions:
    - visual-quality
    - text-media-alignment
    - human-preference
    - provenance
    - deduplication
    - safety
  known_limitations:
    - The six underlying prompt sources are not named and their proportions are absent.
    - Gemini verifier gating at a score of six or higher may encode closed-model bias.
    - The paper does not publish rollout multiplicity, acceptance rate, deduplication, or leakage checks.
processing:
  recipe: Sample structured prompts from the student, render or compare image-conditioned outcomes, retain rollouts scoring at least 6 of 10 under a Gemini verifier, then minimize KL to a frozen image-conditioned teacher through on-policy self-distillation.
  recommended_format: parquet
  notes: A release should preserve seed provenance, all rollouts, verifier version and score, accepted/rejected flags, teacher logits, and split membership.
