quality:
  dimensions:
    - visual-quality
    - provenance
  known_limitations:
    - No official downloadable files, repository, or dataset-specific license were located during verification.
    - Images are downsampled from 512 by 512 pixels to 32 by 32 pixels, limiting conclusions about high-resolution generator artifacts.
    - The released recipe covers three generators and a template-based prompt grammar rather than open-domain production prompts.
processing:
  recipe: Generate balanced CIFAR-10-aligned classes at 512 by 512 pixels with three generators, then downsample with Lanczos resampling to 32 by 32 pixels.
  recommended_format: native
  notes: Preserve the generator, class, split, prompt template, and generation configuration for each image if files are released.
