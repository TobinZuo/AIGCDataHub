description: >-
  A 60,000-image synthetic benchmark aligned to ten CIFAR-10 classes, generated
  equally by FLUX.2-dev, HunyuanImage-3.0, and Qwen-Image-2512 for synthetic-
  image classification and cross-generator generalization research.
