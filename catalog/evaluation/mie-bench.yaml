id: mie-bench
name: MIE-Bench
organization: IntMe Group and collaborators
released_at: "2026-08-03"
release_date_source: https://arxiv.org/abs/2608.02059
modality: evaluation
tasks:
  - multi-source-image-editing
  - image-editing-evaluation
  - human-preference-evaluation
stages:
  - evaluation
description: >-
  A multi-source image-editing benchmark with human mean-opinion scores over
  edits produced by twelve systems across sixteen editing tasks.
access:
  status: unavailable
  type: none
  url: https://github.com/IntMeGroup/MIEScore
  requires_account: false
  notes: The official repository advertises a TmpAccount Hugging Face dataset URL, but that endpoint returned 404 during verification; no downloadable benchmark files are currently available.
scale:
  samples: 3000
  source_items: 36000
  hours: null
  approximate: false
  notes: Each of 3,000 instances contains more than two source images and an edit prompt; twelve models produced 36,000 edited images with more than 108,000 mean-opinion scores.
annotations:
  types:
    - source-image-group
    - editing-instruction
    - edited-image
    - visual-quality-score
    - instruction-following-score
    - attribute-preservation-score
  source: mixed
  languages:
    - en
license:
  metadata: Not stated
  media: Not stated
  commercial_use: unknown
  redistribution: unknown
  notes: The official repository contains no dataset license or source-image rights statement, and its advertised download is not live.
quality:
  dimensions:
    - visual-quality
    - text-media-alignment
    - human-preference
    - provenance
  known_limitations:
    - Source-image identities, licenses, consent, task distribution, splits, and annotator protocol are not disclosed in the current public repository.
    - The advertised dataset and MIEScore model-weight links use a placeholder account and currently return 404.
    - Outputs from twelve selected editing systems may bias evaluation toward their common artifacts and capability profiles.
processing:
  recipe: Pair groups of more than two source images with editing prompts across sixteen tasks, render each instance with twelve editing models, and collect separate human mean-opinion scores for visual quality, instruction following, and attribute preservation.
  recommended_format: native
  notes: Preserve instance grouping, every source-image provenance record, task, prompt, generator version, output, rater protocol, and per-dimension score if released.
evidence:
  homepage: https://github.com/IntMeGroup/MIEScore
  paper: https://arxiv.org/abs/2608.02059
  used_by:
    - MIEScore
status: partial
last_verified: "2026-08-04"
