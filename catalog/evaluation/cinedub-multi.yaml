id: cinedub-multi
name: CineDub-Multi
organization: Monash University, University of Chinese Academy of Sciences, and Tsinghua University
released_at: "2026-08-16"
release_date_source: https://arxiv.org/abs/2608.15734
modality: evaluation
tasks:
  - video-dubbing
  - multi-speaker-dubbing
  - visual-voice-cloning
stages:
  - evaluation
  - data-curation
description: >-
  An announced English multi-speaker visual-dubbing benchmark containing one
  manually verified clip from each of 139 SpeakerVid-5M YouTube channels.
derived_from:
  - catalog_id: speakervid-5m
    relationship: filtered-subset
    contribution: 139 English multi-speaker evaluation clips
    notes: The paper filters SpeakerVid-5M channels for at least two active speakers, multiple turns, and no overlap or background music, but does not release the retained IDs.
access:
  status: gated
  type: request
  url: https://huggingface.co/datasets/Dalision/cinedub_benchmark
  requires_account: true
  notes: The official Hugging Face repository exposes the CineDub-Multi manifest after accepting its automatic access gate; media retrieval still depends on source availability.
scale:
  samples: 139
  source_items: 139
  hours: null
  approximate: false
  notes: The paper reports 139 English samples selected from 139 distinct YouTube channels, with at least two active speakers and multiple dialogue turns per clip.
annotations:
  types:
    - youtube-id
    - clip-timestamp
    - transcript
    - speaker-turn
    - active-speaker
    - semantic-bundled-transcription
  source: mixed
  languages:
    - en
license:
  metadata: CC-BY-NC-4.0
  media: Source-dependent YouTube and rightsholder terms inherited through SpeakerVid-5M
  commercial_use: unknown
  redistribution: review-required
  notes: The repository applies CC-BY-NC-4.0 to benchmark metadata; Gemini annotations do not change source-media rights inherited from YouTube and SpeakerVid-5M.
quality:
  dimensions:
    - visual-quality
    - audio-quality
    - audio-visual-alignment
    - text-media-alignment
    - temporal-consistency
    - provenance
  known_limitations:
    - The manifest is gated and authenticated media reconstruction was not exercised during this automated verification.
    - The selection excludes overlapping speech and background music, narrowing real-world multi-speaker conditions.
    - YouTube availability, speaker identity, consent, privacy, biometric use, and demographic coverage are not documented.
processing:
  recipe: null
  recommended_format: native
  notes: Preserve source ID, timestamp, retrieval date, active-speaker turns, transcript, language, generated outputs, metric versions, and rights review if the benchmark is released.
evidence:
  homepage: https://cinedub2026.github.io/
  paper: https://arxiv.org/abs/2608.15734
  used_by:
    - CineDub
status: partial
last_verified: "2026-08-19"
