name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate data cards
        run: python scripts/validate_catalog.py
      - name: Validate model and data-strategy cards
        run: python scripts/validate_models.py
      - name: Validate candidate source platforms
        run: python scripts/validate_source_platforms.py
      - name: Check catalog freshness
        run: python scripts/check_freshness.py
      - name: Check generated README
        run: python scripts/build_readme.py --check
      - name: Check dataset access index
        run: python scripts/build_dataset_access_index.py --check
      - name: Check candidate source-platform index
        run: python scripts/build_source_platform_index.py --check
      - name: Check model-dataset audit index
        run: python scripts/build_model_dataset_index.py --check
      - name: Check generated site data
        run: python scripts/build_site_data.py --check
      - name: Check reproducible manifest audit example
        run: >-
          python scripts/audit_manifest.py examples/manifests/tiny-multimodal.jsonl
          --sample-size 8
          --json-out examples/reports/tiny-multimodal.json
          --markdown-out examples/reports/tiny-multimodal.md
          --fail-on-invalid
          --min-provenance-coverage 1
          --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
