acceptance_rules:
  - Require an official release, repository, model card, dataset card, or technical report.
  - Record publication and release dates separately when they differ.
  - Never infer exact datasets or licenses from model capabilities.
  - Record named but unreleased corpora with availability not-released.
  - Add every material unknown to the card rather than silently omitting it.
  - Prefer one deeply verified card over many link-only entries.
