schema_version: 2
policy:
  boundary: Candidate content-source platforms are not dataset releases and do not provide a repository download action.
  rights: Every platform requires source-specific review of platform terms, rightsholder permissions, privacy, regional access, and the intended training use before collection.
  internal_notes: Operational assessments from non-public planning material are intentionally excluded from the public registry.
platforms:
  - id: youtube
    name: YouTube
    homepage: https://www.youtube.com/
    category: video-platform
    modalities: [video, audio, image, text]
    relevant_scenarios: [video-generation, digital-human, video-localization]
    content_scope: User-published video, audio, thumbnails, captions, and metadata.
    data_access:
      status: documented-api
      interface_name: YouTube Data API v3
      interface_url: https://developers.google.com/youtube/v3/docs
      scope: Video, channel, playlist, thumbnail, caption metadata, and authorized account resources.
      requirements: Google Cloud project, API key or OAuth, quota, and API policy compliance.
      training_rights: not-granted-by-interface
    monitoring:
      url: https://developers.google.com/youtube/v3/docs
      mode: content-revision
      focus: API scope, authentication, quota, policy, and deprecation changes.
      priority: high
    source_status: candidate
    access_boundary: source-platform-not-dataset
    rights_review: required
    last_reviewed: "2026-07-27"
