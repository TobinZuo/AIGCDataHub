schema_version: 1
policy:
  boundary: Candidate content-source platforms are not dataset releases and do not provide a repository download action.
  rights: Every platform requires source-specific review of platform terms, rightsholder permissions, privacy, regional access, and the intended training use before collection.
  internal_notes: Operational assessments from non-public planning material are intentionally excluded from the public registry.
platforms:
